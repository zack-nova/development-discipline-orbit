package:
    type: orbit
    name: development-discipline-orbit
description: development-discipline-orbit orbit
meta:
    file: .harness/orbits/development-discipline-orbit.yaml
    agents_template: |
        # Development Discipline Workflow

        Development Discipline Workflow 用于在需要时选择并执行 TDD、diagnose 或 review-commit 反馈纪律。

        ## 按需读取

        - 开发新行为、修复行为并明确需要 test-first 时，使用 `tdd` skill，并读取该 skill 指向的测试、mocking、refactoring 等材料。
        - 遇到 bug、失败、性能回退或根因不明问题时，使用 `diagnose` skill。
        - 完成本地变更并需要 review、记录非阻塞技术债或提交时，使用 `review-commit` skill。

        ## 常驻边界

        - 不要把没有复现、失败信号或通过信号的工作报告成已验证。
        - 报告完成结果时说明使用的反馈循环、观察到的失败信号、通过信号、commit 或技术债记录结果，以及仍缺失的证据。
    humans_template: |
        # HUMANS.md - Development Discipline Orbit

        这个 orbit 给想在代码仓库中保持小步、可验证开发纪律的人使用。

        可用 skill：

        - `diagnose`
        - `review-commit`
        - `tdd`

        遇到 bug、失败、性能回退或根因不明的问题时使用 `diagnose`。
        开发新行为、调整已有行为或希望走 red-green-refactor 时使用 `tdd`。
        完成本地变更后，希望审查变更、记录非阻塞技术债并创建 commit 时使用 `review-commit`。
    include_in_projection: true
    include_in_write: true
    include_in_export: true
    include_description_in_orchestration: true
capabilities:
    commands:
        paths:
            include:
                - commands/development-discipline-orbit/**/*.md
    skills:
        local:
            paths:
                include:
                    - skills/development-discipline-orbit/*
content:
    - name: development-discipline-rules
      role: rule
      paths:
        include:
            - docs/development-discipline-orbit/**
behavior:
    scope:
        projection_roles:
            - meta
            - subject
            - rule
            - process
        write_roles:
            - meta
            - rule
        export_roles:
            - meta
            - rule
        orchestration_roles:
            - meta
            - rule
            - process
    orchestration:
        include_orbit_description: true
        materialize_agents_from_meta: true

